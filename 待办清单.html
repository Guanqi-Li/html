<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f6f3" id="themeColorMeta">
<title>待办清单</title>
<style>
  :root{
    --bg:#f7f6f3;
    --rail-bg:#f2f1ec;
    --surface:#ffffff;
    --surface-glass:rgba(247,246,243,.84);
    --surface-muted:#efeee9;
    --surface-hover:#f5f4f0;
    --line:rgba(24,24,27,.08);
    --line-strong:rgba(24,24,27,.14);
    --text:#141416;
    --text-sub:#595962;
    --text-muted:#8d8d97;
    --ink:#18181b;
    --ink-text:#ffffff;
    --ink-hover:#27272a;
    --primary:#2f5bea;
    --primary-soft:rgba(47,91,234,.10);
    --high:#cf2e4b;
    --high-soft:rgba(207,46,75,.09);
    --mid:#b86b11;
    --mid-soft:rgba(184,107,17,.10);
    --success:#15805d;
    --success-soft:rgba(21,128,93,.11);
    --danger:#c92a2a;
    --danger-soft:rgba(201,42,42,.09);
    --shadow-sheet:0 1px 2px rgba(24,24,27,.03), 0 8px 24px -10px rgba(24,24,27,.06);
    --shadow-pop:0 20px 56px -12px rgba(24,24,27,.22), 0 0 0 1px var(--line);
    --transition:all .2s cubic-bezier(.22,1,.36,1);
    --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","HarmonyOS Sans SC","MiSans","Helvetica Neue","Microsoft YaHei",sans-serif;
  }

  [data-theme="dark"]{
    --bg:#111113;
    --rail-bg:#161619;
    --surface:#1a1a1e;
    --surface-glass:rgba(17,17,19,.84);
    --surface-muted:#222227;
    --surface-hover:#202025;
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.14);
    --text:#f2f2f5;
    --text-sub:#a1a1ad;
    --text-muted:#6e6e7a;
    --ink:#f4f4f6;
    --ink-text:#111113;
    --ink-hover:#ffffff;
    --primary:#5b82ff;
    --primary-soft:rgba(91,130,255,.15);
    --high:#fb5673;
    --high-soft:rgba(251,86,115,.14);
    --mid:#f5a524;
    --mid-soft:rgba(245,165,36,.14);
    --success:#34d399;
    --success-soft:rgba(52,211,153,.14);
    --danger:#f87171;
    --danger-soft:rgba(248,113,113,.14);
    --shadow-sheet:0 1px 2px rgba(0,0,0,.25), 0 10px 28px -10px rgba(0,0,0,.45);
    --shadow-pop:0 24px 64px -10px rgba(0,0,0,.65), 0 0 0 1px var(--line-strong);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font-sans);
    font-feature-settings:"cv02","cv03","cv04","cv11";
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    line-height:1.5;
    transition:background-color .22s ease, color .22s ease;
  }

  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;color:inherit;}

  .app-shell{min-height:100vh;}
  .view{display:none;}
  .view.active{display:block;animation:fadeIn .18s ease-out;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  /* ===== 桌面一体化 Studio 分栏架构 ===== */
  .layout{
    display:grid;
    grid-template-columns:268px minmax(0,1fr);
    min-height:100vh;
  }

  /* 左侧架构导航栏 */
  .sidebar{
    background:var(--rail-bg);
    border-right:1px solid var(--line);
    padding:24px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:18px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }

  /* 顶部品牌 + 实时完成度圆环 */
  .brand-card{display:flex;flex-direction:column;gap:14px;}
  .brand-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand-title-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-ring{
    position:relative;width:36px;height:36px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-ring svg{transform:rotate(-90deg);width:36px;height:36px;}
  .ring-bg{fill:none;stroke:var(--line-strong);stroke-width:2.6;}
  .ring-fg{
    fill:none;stroke:var(--primary);stroke-width:2.6;stroke-linecap:round;
    transition:stroke-dashoffset .45s cubic-bezier(.22,1,.36,1);
  }
  .ring-pct{
    position:absolute;font-size:9.5px;font-weight:700;color:var(--text);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .brand-text h1{
    font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--text);
  }
  .brand-date{
    font-size:11.5px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums;
  }
  .brand-controls{display:flex;align-items:center;gap:6px;flex:none;}
  .theme-btn{
    width:30px;height:30px;border-radius:9px;
    border:1px solid var(--line);background:var(--surface);
    color:var(--text-sub);display:flex;align-items:center;justify-content:center;
    transition:var(--transition);
  }
  .theme-btn:hover{border-color:var(--line-strong);color:var(--text);}

  /* 桌面新建按钮 + 快捷键提示 */
  .desktop-add-btn{
    width:100%;
    background:var(--ink);color:var(--ink-text);
    font-size:13.5px;font-weight:500;
    padding:10px 14px;border-radius:11px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 4px 12px rgba(0,0,0,.10);
    transition:var(--transition);
  }
  .desktop-add-btn:hover{background:var(--ink-hover);transform:translateY(-1px);}
  .desktop-add-btn:active{transform:translateY(0);}
  .add-btn-left{display:flex;align-items:center;gap:8px;}
  .kbd{
    font-size:10.5px;font-weight:600;padding:1.5px 6px;border-radius:5px;
    background:rgba(128,128,128,.22);color:inherit;opacity:.85;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  /* 移动端头部快捷操作 */
  .mobile-head-actions{display:none;align-items:center;gap:6px;flex:none;}
  .pill-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);
    font-size:11.5px;font-weight:500;color:var(--text-sub);
    transition:var(--transition);
  }
  .pill-btn.bound{border-color:rgba(21,128,93,.35);color:var(--success);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex:none;}
  .pill-btn.bound .dot{background:var(--success);box-shadow:0 0 0 3px var(--success-soft);}

  /* 瑞士表盘式 2×2 精密指标格（单一细线分割，无臃肿白盒） */
  .stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow-sheet);
  }
  .stat{
    padding:12px 14px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    transition:var(--transition);
  }
  .stat:nth-child(2n){border-right:none;}
  .stat:nth-child(n+3){border-bottom:none;}
  .stat:hover{background:var(--surface-hover);}
  .stat .num{
    font-size:21px;font-weight:600;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.15;color:var(--text);
  }
  .stat.today .num{color:var(--primary);}
  .stat.done .num{color:var(--success);}
  .stat.pause .num{color:var(--mid);}
  .stat .label{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:500;}

  /* 侧边栏分类导航 */
  .side-section{display:flex;flex-direction:column;gap:6px;}
  .side-title{
    font-size:10.5px;font-weight:600;color:var(--text-muted);
    letter-spacing:.09em;padding:0 10px;text-transform:uppercase;
  }
  .cat-nav{display:flex;flex-direction:column;gap:2px;}
  .cat-item{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border-radius:9px;
    font-size:13.5px;font-weight:400;color:var(--text-sub);
    transition:var(--transition);position:relative;
  }
  .cat-item:hover{background:rgba(128,128,128,.07);color:var(--text);}
  .cat-item.active{
    background:var(--surface);color:var(--text);font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.05), 0 0 0 1px var(--line);
  }
  .cat-item .cat-left{display:flex;align-items:center;gap:9px;}
  .cat-dot{width:7px;height:7px;border-radius:50%;background:#a1a1aa;}
  .cat-item[data-cat="工作"] .cat-dot{background:#2f5bea;}
  .cat-item[data-cat="生活"] .cat-dot{background:#15805d;}
  .cat-item[data-cat="学习"] .cat-dot{background:#8b5cf6;}
  .cat-item[data-cat="其他"] .cat-dot{background:#71717a;}
  .cat-cnt{
    font-size:11.5px;font-variant-numeric:tabular-nums;
    color:var(--text-muted);min-width:18px;text-align:right;
  }
  .cat-item.active .cat-cnt{color:var(--text);}

  /* 侧栏底部云端与备份区 */
  .side-sync-card{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
  .sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .data-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:var(--surface);border:1px solid var(--line);color:var(--text-sub);
    padding:7.5px 8px;font-size:11.5px;font-weight:500;border-radius:9px;
    transition:var(--transition);white-space:nowrap;
  }
  .data-btn:hover:not(:disabled){
    color:var(--text);border-color:var(--line-strong);background:var(--surface-hover);
  }
  .data-btn.bound{
    border-color:rgba(21,128,93,.32);color:var(--success);background:var(--success-soft);
  }
  .data-btn.full{grid-column:1 / -1;}
  .data-btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ===== 右侧主工作画布 ===== */
  .main-pane{
    min-width:0;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }

  /* 顶部吸顶磨砂控制栏 */
  .top-bar{
    position:sticky;top:0;z-index:15;
    background:var(--surface-glass);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-bottom:1px solid var(--line);
    padding:16px clamp(20px,3.6vw,44px);
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .view-heading{
    display:flex;align-items:baseline;gap:10px;min-width:0;
  }
  .view-heading h2{
    font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--text);
  }
  .view-heading-count{
    font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;
  }

  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .tabs{
    display:inline-flex;position:relative;z-index:2;
    background:var(--surface-muted);
    border:1px solid var(--line);border-radius:10px;padding:3px;
    touch-action:manipulation;
  }
  .tab{
    position:relative;z-index:1;
    padding:5.5px 13px;font-size:12.5px;font-weight:500;border-radius:7.5px;
    color:var(--text-sub);transition:var(--transition);white-space:nowrap;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  .tab:hover{color:var(--text);}
  .tab.active{
    background:var(--surface);color:var(--text);font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .mobile-cat-select{
    display:none;
    border:1px solid var(--line);border-radius:9px;
    padding:6.5px 9px;font-size:12.5px;background:var(--surface);color:var(--text);outline:none;
  }
  .search-wrap{
    width:220px;position:relative;display:flex;align-items:center;
  }
  .search-icon{
    position:absolute;left:10px;color:var(--text-muted);pointer-events:none;display:flex;
  }
  #search{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:6.5px 30px 6.5px 32px;font-size:13px;background:var(--surface);
    color:var(--text);outline:none;transition:var(--transition);
  }
  #search::placeholder{color:var(--text-muted);}
  #search:focus{
    border-color:var(--line-strong);
    box-shadow:0 0 0 3px var(--primary-soft);
  }
  .search-clear{
    position:absolute;right:7px;width:20px;height:20px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    color:var(--text-muted);font-size:14px;
  }
  .search-clear.show{display:flex;}
  .search-clear:hover{background:var(--surface-muted);color:var(--text);}

  /* 内容容器 */
  .canvas-inner{
    padding:18px clamp(20px,3.6vw,44px) 0;
    max-width:960px;
    width:100%;
    display:flex;flex-direction:column;gap:14px;
  }

  /* 移动端专属数据工具条 */
  .mobile-data-bar{
    display:none;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:6px;gap:6px;
  }

  /* ===== 分组纸张列表（Apple / Linear 质感） ===== */
  .list-groups{display:flex;flex-direction:column;gap:18px;}
  .group-block{display:flex;flex-direction:column;gap:7px;}
  .group-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:0 4px;font-size:12px;font-weight:600;color:var(--text-muted);
    letter-spacing:.02em;
  }
  .group-label{display:inline-flex;align-items:center;gap:6px;}
  .group-header .cnt{
    font-size:11px;font-weight:500;color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .group-header.group-overdue{color:var(--high);}
  .group-header.group-today{color:var(--text);}

  ul.list{
    list-style:none;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow-sheet);
    overflow:hidden;
  }

  .item{
    padding:12px 16px;
    display:flex;flex-direction:column;gap:6px;
    border-bottom:1px solid var(--line);
    transition:background-color .16s ease, opacity .2s ease;
    position:relative;
  }
  .item:last-child{border-bottom:none;}
  .item:hover{background:var(--surface-hover);}
  .item.prio-high-row::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:2.5px;
    border-radius:0 3px 3px 0;background:var(--high);opacity:.75;
  }
  .item.done{opacity:.56;}
  .item.done .item-title{text-decoration:line-through;color:var(--text-muted);}

  .check{
    width:19px;height:19px;border:1.6px solid var(--line-strong);border-radius:50%;
    flex:none;display:flex;align-items:center;justify-content:center;
    background:transparent;transition:var(--transition);
  }
  .check:hover{border-color:var(--primary);background:var(--primary-soft);}
  .check.checked{background:var(--ink);border-color:var(--ink);transform:scale(1.03);}
  .check.checked::after{
    content:"";width:7.5px;height:4.2px;
    border-left:1.8px solid var(--ink-text);border-bottom:1.8px solid var(--ink-text);
    transform:rotate(-45deg) translate(1px,-1px);
  }

  .item-top-row{display:flex;align-items:center;gap:12px;min-height:26px;}
  .item-title{
    flex:1;min-width:0;
    font-size:17px;font-weight:400;word-break:break-word;
    letter-spacing:-.01em;color:var(--text);line-height:1.38;
  }

  .item-bottom-row{
    padding-left:31px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:6px 12px;
  }
  .item-tags{
    display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-width:0;
    color:var(--text-muted);font-size:12px;
  }
  .start-label{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;font-weight:400;color:var(--text-sub);
    font-variant-numeric:tabular-nums;
  }
  .start-label.overdue{color:var(--high);font-weight:500;}

  .tag{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:400;color:var(--text-muted);
  }
  .tag.cat{color:var(--text-sub);}
  .tag.prio-high::before,
  .tag.prio-mid::before,
  .tag.prio-low::before{
    content:"";width:5.5px;height:5.5px;border-radius:50%;flex:none;
  }
  .tag.prio-high{color:var(--text-sub);}
  .tag.prio-high::before{background:var(--high);}
  .tag.prio-mid::before{background:#d4831a;}
  .tag.prio-low::before{background:#a1a1aa;}
  .tag.rep{color:var(--text-muted);}
  .tag.paused{color:var(--mid);}

  /* ===== 子任务（底部右侧对齐，桌面加宽） ===== */
  .sub-inline{
    margin-left:auto;display:flex;align-items:center;gap:10px;
    flex:1 1 260px;max-width:340px;min-width:220px;
  }
  .sub-progress{font-size:11.5px;font-weight:500;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sub-bar{flex:1;min-width:60px;height:3.5px;border-radius:999px;background:var(--line-strong);overflow:hidden;}
  .sub-bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s cubic-bezier(.22,1,.36,1);}
  .sub-toggle{
    padding:2.5px 9px;border-radius:6px;
    font-size:11.5px;font-weight:500;color:var(--text-sub);
    background:var(--surface-muted);border:1px solid var(--line);
    display:inline-flex;align-items:center;gap:3px;
    transition:var(--transition);flex:none;white-space:nowrap;
  }
  .sub-toggle:hover{background:var(--ink);border-color:var(--ink);color:var(--ink-text);}

  .sub-list{
    padding-left:31px;padding-top:8px;margin-top:4px;
    border-top:1px dashed var(--line);
    display:flex;flex-direction:column;gap:6px;
  }
  .sub-list[hidden]{display:none;}
  .sub{display:flex;gap:9px;align-items:center;padding:2px 0;}
  .sub .check{width:16px;height:16px;margin-top:0;}
  .sub .check.checked::after{width:6.5px;height:3.8px;}
  .sub-title{font-size:13.5px;flex:1;word-break:break-word;color:var(--text-sub);font-weight:400;}
  .sub.done .sub-title{text-decoration:line-through;color:var(--text-muted);}
  .sub-del{
    color:var(--text-muted);font-size:15px;width:26px;height:26px;
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    transition:var(--transition);
  }
  .sub-del:hover{background:var(--danger-soft);color:var(--danger);}

  /* ===== 操作按钮（桌面静默低噪，悬停清晰显现） ===== */
  .item-ops{
    display:flex;gap:5px;flex:none;align-items:center;
    opacity:.68;transition:opacity .16s ease;
  }
  .item:hover .item-ops,.item:focus-within .item-ops{opacity:1;}
  .icon-btn{
    height:26px;padding:0 9px;border-radius:7px;
    background:transparent;border:1px solid var(--line);
    color:var(--text-sub);font-size:11.5px;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;
    transition:var(--transition);
  }
  .icon-btn:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-muted);}
  .icon-btn.pause.on{background:var(--mid-soft);border-color:rgba(184,107,17,.26);color:var(--mid);}
  .del-btn{
    height:26px;padding:0 9px;border-radius:7px;
    background:transparent;border:1px solid var(--line);color:var(--text-sub);
    font-size:11.5px;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;
    transition:var(--transition);
  }
  .del-btn:hover{background:var(--danger);border-color:var(--danger);color:#fff;}

  /* ===== 空状态 & 页脚 ===== */
  .empty{
    text-align:center;color:var(--text-sub);padding:72px 20px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow-sheet);
  }
  .empty-icon{
    width:46px;height:46px;border-radius:14px;margin:0 auto 14px;
    background:var(--surface-muted);color:var(--text-sub);
    display:flex;align-items:center;justify-content:center;
  }
  .empty-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:4px;}
  .empty-sub{font-size:13px;color:var(--text-muted);}

  .footer-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 4px;gap:12px;flex-wrap:wrap;
  }
  .footer-bar .count{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .btn-clear{
    color:var(--text-muted);font-size:12px;font-weight:500;
    padding:5px 10px;border-radius:8px;transition:var(--transition);
  }
  .btn-clear:hover{background:var(--danger-soft);color:var(--danger);}

  /* ===== 浮动加号（移动端） ===== */
  .fab{
    position:fixed;
    right:clamp(18px,5vw,28px);
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:52px;height:52px;border-radius:50%;
    background:var(--ink);color:var(--ink-text);
    font-size:24px;line-height:1;
    display:none;align-items:center;justify-content:center;
    box-shadow:0 12px 28px rgba(0,0,0,.24);
    z-index:25;transition:var(--transition);
  }
  .fab:active{transform:scale(.94);}

  /* ===== 新增 / 编辑视图 ===== */
  .edit-shell{
    min-height:100vh;
    padding:clamp(20px,4vw,44px) 16px calc(48px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;align-items:flex-start;
  }
  .edit-wrap{width:100%;max-width:580px;}
  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .back-btn{
    background:var(--surface);border:1px solid var(--line);
    width:36px;height:36px;border-radius:10px;color:var(--text);
    font-size:19px;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-sheet);transition:var(--transition);
  }
  .back-btn:hover{border-color:var(--line-strong);background:var(--surface-hover);}
  .page-head h1{font-size:19px;font-weight:600;letter-spacing:-.02em;}

  form.card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:24px;box-shadow:var(--shadow-sheet);
  }
  .form-label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:7px;}
  #title{
    width:100%;border:1px solid var(--line-strong);border-radius:11px;
    padding:12px 14px;font-size:16px;font-weight:400;outline:none;
    background:var(--bg);color:var(--text);transition:var(--transition);
  }
  #title:focus{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:6px;}
  .field select,.field input{
    width:100%;border:1px solid var(--line-strong);border-radius:11px;
    padding:10px 12px;font-size:14px;background:var(--bg);
    color:var(--text);outline:none;transition:var(--transition);
  }
  .field select:focus,.field input:focus{
    border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft);
  }

  /* 表单内子任务管理 */
  .form-subs{
    margin-top:20px;padding-top:18px;border-top:1px dashed var(--line-strong);
  }
  .form-subs-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .form-subs-head span{font-size:12px;font-weight:500;color:var(--text-muted);}
  .form-sub-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .form-sub-row{display:flex;align-items:center;gap:8px;}
  .form-sub-row .check{width:18px;height:18px;margin-top:0;}
  .form-sub-input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font-size:14px;background:var(--bg);
    color:var(--text);outline:none;transition:var(--transition);
  }
  .form-sub-input:focus{border-color:var(--ink);background:var(--surface);}
  .form-sub-row.done .form-sub-input{text-decoration:line-through;color:var(--text-muted);}
  .form-sub-add{display:flex;gap:8px;}
  .form-sub-add input{
    flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:10px;
    padding:9px 12px;font-size:14px;background:var(--bg);
    color:var(--text);outline:none;transition:var(--transition);
  }
  .form-sub-add input:focus{border-color:var(--ink);background:var(--surface);}
  .form-sub-add button{
    background:var(--surface-muted);border:1px solid var(--line);color:var(--text);
    padding:9px 16px;font-size:13px;font-weight:500;border-radius:10px;
    transition:var(--transition);flex:none;
  }
  .form-sub-add button:hover{background:var(--ink);border-color:var(--ink);color:var(--ink-text);}

  /* 大号日期选择器 */
  .date-field-wrap{position:relative;display:flex;align-items:center;}
  .date-field-wrap input{cursor:pointer;padding-right:36px;}
  .date-field-icon{position:absolute;right:11px;color:var(--text-muted);pointer-events:none;display:flex;}
  .dp-card{
    background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:380px;
    box-shadow:var(--shadow-pop);animation:fadeIn .15s ease-out;
  }
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .dp-month-label{font-size:16px;font-weight:600;color:var(--text);}
  .dp-nav{display:flex;gap:6px;}
  .dp-nav button{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:17px;
    display:flex;align-items:center;justify-content:center;transition:var(--transition);
  }
  .dp-nav button:hover{border-color:var(--line-strong);background:var(--surface-muted);}
  .dp-weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    text-align:center;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:8px;
  }
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .dp-day{
    height:42px;border-radius:10px;font-size:14px;font-weight:400;
    color:var(--text);display:flex;align-items:center;justify-content:center;
    transition:var(--transition);font-variant-numeric:tabular-nums;
  }
  .dp-day:hover{background:var(--surface-muted);}
  .dp-day.other-month{color:var(--text-muted);opacity:.55;}
  .dp-day.today{border:1.5px solid var(--ink);color:var(--text);font-weight:600;}
  .dp-day.selected{background:var(--ink);color:var(--ink-text);font-weight:600;}
  .dp-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
  }
  .dp-quick{display:flex;gap:6px;}
  .dp-quick button,.dp-close{
    padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
    background:var(--bg);border:1px solid var(--line);color:var(--text-sub);
    transition:var(--transition);
  }
  .dp-quick button:hover,.dp-close:hover{border-color:var(--line-strong);color:var(--text);}

  .form-actions{display:flex;gap:10px;margin-top:22px;}
  .btn-primary{
    flex:1;background:var(--ink);color:var(--ink-text);
    padding:12px 18px;font-size:14px;font-weight:500;border-radius:11px;
    transition:var(--transition);
  }
  .btn-primary:hover{background:var(--ink-hover);}
  .btn-ghost{
    background:var(--bg);border:1px solid var(--line);
    color:var(--text-sub);padding:12px 18px;font-size:14px;font-weight:500;
    border-radius:11px;transition:var(--transition);
  }
  .btn-ghost:hover{background:var(--surface-muted);color:var(--text);}

  #importFile{display:none;}

  /* ===== 遮罩、弹窗、Toast ===== */
  .load-mask,.modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:70;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);padding:16px;
  }
  .load-mask[hidden],.modal-mask[hidden]{display:none;}
  .load-box{
    background:var(--surface);border-radius:16px;padding:26px 30px;text-align:center;
    box-shadow:var(--shadow-pop);max-width:300px;width:100%;
  }
  .load-spin{
    width:26px;height:26px;border:2.5px solid var(--line-strong);
    border-top-color:var(--ink);border-radius:50%;margin:0 auto 12px;
    animation:spin .75s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loadMsg{font-size:13.5px;color:var(--text-sub);}

  .modal-card{
    background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:400px;
    box-shadow:var(--shadow-pop);animation:fadeIn .15s ease-out;
  }
  .modal-title{font-size:16px;font-weight:600;color:var(--text);}
  .modal-desc{font-size:13.5px;color:var(--text-sub);margin-top:8px;line-height:1.55;}
  .modal-input{
    width:100%;margin-top:12px;border:1px solid var(--line-strong);
    border-radius:10px;padding:10px 12px;font-size:15px;
    background:var(--bg);color:var(--text);outline:none;
  }
  .modal-input:focus{border-color:var(--ink);background:var(--surface);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-btn{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:500;transition:var(--transition);}
  .modal-btn.cancel{background:var(--bg);border:1px solid var(--line);color:var(--text-sub);}
  .modal-btn.cancel:hover{color:var(--text);}
  .modal-btn.confirm{background:var(--ink);color:var(--ink-text);}
  .modal-btn.confirm:hover{background:var(--ink-hover);}
  .modal-btn.danger{background:var(--danger);color:#fff;}

  .toast-box{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:80;
    display:flex;flex-direction:column;gap:8px;align-items:center;
    pointer-events:none;width:calc(100% - 32px);max-width:360px;
  }
  .toast{
    background:var(--ink);color:var(--ink-text);
    padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:0 12px 28px rgba(0,0,0,.22);animation:fadeIn .15s ease-out;text-align:center;
  }
  .toast.error{background:#b91c1c;color:#fff;}
  .toast.success{background:#15805d;color:#fff;}

  /* ===== 窄桌面 / Mac 半屏（681px–960px） ===== */
  @media (max-width:960px) and (min-width:681px){
    .layout{grid-template-columns:228px minmax(0,1fr);}
    .sidebar{padding:18px 14px;}
    .top-bar{padding:14px 20px;}
    .canvas-inner{padding:14px 20px 0;}
    .search-wrap{width:170px;}
  }

  /* ===== 手机响应式适配（<= 680px，首屏即见待办内容） ===== */
  @media (max-width:680px){
    .layout{grid-template-columns:1fr;min-height:auto;}
    .sidebar{
      position:static;height:auto;overflow:visible;
      background:transparent;border-right:none;
      padding:10px 10px 0;gap:8px;
    }
    .brand-card{
      background:var(--surface);border:1px solid var(--line);
      border-radius:13px;padding:9px 12px;gap:0;
      box-shadow:var(--shadow-sheet);
    }
    .brand-ring{width:30px;height:30px;}
    .brand-ring svg{width:30px;height:30px;}
    .ring-pct{font-size:8.5px;}
    .brand-text h1{font-size:16px;}
    .brand-date{display:none;}
    .desktop-add-btn,.side-cat-card,.side-sync-card,.view-heading{display:none;}
    .mobile-head-actions{display:flex;}

    .stats{grid-template-columns:repeat(4,1fr);border-radius:12px;}
    .stat{
      padding:7px 4px;text-align:center;
      border-bottom:none;border-right:1px solid var(--line);
    }
    .stat:nth-child(2n){border-right:1px solid var(--line);}
    .stat:last-child{border-right:none;}
    .stat .num{font-size:16.5px;line-height:1.1;}
    .stat .label{font-size:10px;margin-top:2px;white-space:nowrap;}

    .main-pane{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
    .top-bar{
      position:static;background:transparent;backdrop-filter:none;border-bottom:none;
      padding:8px 10px 0;
    }
    .toolbar{
      width:100%;background:var(--surface);border:1px solid var(--line);
      border-radius:13px;padding:8px 9px;gap:6px;box-shadow:var(--shadow-sheet);
    }
    .tabs{flex:1 1 auto;min-width:0;}
    .tab{flex:1;padding:6px 4px;font-size:12px;text-align:center;}
    .mobile-cat-select{display:block;flex:none;}
    .search-wrap{width:100%;flex:1 1 100%;}
    #search{padding:6px 30px 6px 30px;height:34px;font-size:16px;}

    .canvas-inner{padding:8px 10px 0;gap:8px;}
    .mobile-data-bar{display:grid;grid-template-columns:repeat(4,1fr);}
    .mobile-data-bar .data-btn{padding:6.5px 2px;font-size:11px;border-radius:8px;background:var(--bg);}

    .item-ops{opacity:1;}
    .item{padding:10px 12px;gap:6px;}
    .item-top-row{flex-wrap:wrap;gap:6px 8px;}
    .item-ops{margin-left:auto;}
    .item-bottom-row{padding-left:29px;}
    .sub-inline{margin-left:0;flex:1 1 100%;max-width:none;min-width:0;}
    .sub-list{padding-left:29px;}
    .fab{display:flex;}
    .form-grid{grid-template-columns:1fr;}
    form.card{padding:18px;}
    .field select,.field input,#title,.form-sub-add input,.form-sub-input{font-size:16px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="app-shell">

  <!-- ================= 视图：列表首页 ================= -->
  <section class="view active" id="view-list">
    <div class="layout">

      <!-- 左侧导航栏（桌面全高架构；手机端折叠为极简首屏） -->
      <aside class="sidebar">
        <div class="brand-card">
          <div class="brand-top">
            <div class="brand-title-wrap">
              <div class="brand-ring" title="总体完成度">
                <svg viewBox="0 0 36 36">
                  <circle class="ring-bg" cx="18" cy="18" r="15"></circle>
                  <circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"></circle>
                </svg>
                <span class="ring-pct" id="ringPct">0%</span>
              </div>
              <div class="brand-text">
                <h1>待办清单</h1>
                <div class="brand-date" id="todayDateDisplay"></div>
              </div>
            </div>
            <div class="brand-controls">
              <div class="mobile-head-actions">
                <button type="button" class="pill-btn" id="bindBtnMobile">
                  <span class="dot"></span>
                  <span id="bindBtnMobileText">绑定云端</span>
                </button>
              </div>
              <button type="button" class="theme-btn" id="themeToggle" aria-label="切换深浅色主题" title="切换深浅色主题">
                <svg id="themeIconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
                <svg id="themeIconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              </button>
            </div>
          </div>

          <button type="button" class="desktop-add-btn" id="desktopAddBtn">
            <span class="add-btn-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新建待办
            </span>
            <span class="kbd">N</span>
          </button>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="num" id="statActive">0</div>
            <div class="label">进行中</div>
          </div>
          <div class="stat today">
            <div class="num" id="statToday">0</div>
            <div class="label">今日待办</div>
          </div>
          <div class="stat done">
            <div class="num" id="statDone">0</div>
            <div class="label">已完成</div>
          </div>
          <div class="stat pause">
            <div class="num" id="statPaused">0</div>
            <div class="label">已中止</div>
          </div>
        </div>

        <div class="side-section side-cat-card">
          <div class="side-title">分类</div>
          <div class="cat-nav" id="sideCatNav">
            <button type="button" class="cat-item active" data-cat="all">
              <span class="cat-left"><span class="cat-dot"></span>全部分类</span>
              <span class="cat-cnt" data-cnt="all">0</span>
            </button>
            <button type="button" class="cat-item" data-cat="工作">
              <span class="cat-left"><span class="cat-dot"></span>工作</span>
              <span class="cat-cnt" data-cnt="工作">0</span>
            </button>
            <button type="button" class="cat-item" data-cat="生活">
              <span class="cat-left"><span class="cat-dot"></span>生活</span>
              <span class="cat-cnt" data-cnt="生活">0</span>
            </button>
            <button type="button" class="cat-item" data-cat="学习">
              <span class="cat-left"><span class="cat-dot"></span>学习</span>
              <span class="cat-cnt" data-cnt="学习">0</span>
            </button>
            <button type="button" class="cat-item" data-cat="其他">
              <span class="cat-left"><span class="cat-dot"></span>其他</span>
              <span class="cat-cnt" data-cnt="其他">0</span>
            </button>
          </div>
        </div>

        <div class="side-section side-sync-card">
          <div class="side-title">云端与备份</div>
          <div class="sync-grid">
            <button type="button" class="data-btn full" id="bindBtn">绑定云端</button>
            <button type="button" class="data-btn" id="saveCloudBtn">保存到云端</button>
            <button type="button" class="data-btn" id="pullCloudBtn">从云端拉取</button>
            <button type="button" class="data-btn" id="exportJson">导出备份</button>
            <button type="button" class="data-btn" id="importBtn">导入备份</button>
          </div>
        </div>
      </aside>

      <!-- 右侧主工作画布 -->
      <main class="main-pane">
        <div class="top-bar">
          <div class="view-heading">
            <h2 id="viewHeadingTitle">全部待办</h2>
            <span class="view-heading-count" id="viewHeadingCount">0 项</span>
          </div>

          <div class="toolbar">
            <div class="tabs" id="statusTabs">
              <button type="button" class="tab active" data-status="all">全部</button>
              <button type="button" class="tab" data-status="active">进行中</button>
              <button type="button" class="tab" data-status="done">已完成</button>
            </div>
            <select id="filterCategory" class="mobile-cat-select" aria-label="分类筛选">
              <option value="all">全部分类</option>
              <option value="工作">工作</option>
              <option value="生活">生活</option>
              <option value="学习">学习</option>
              <option value="其他">其他</option>
            </select>
            <div class="search-wrap">
              <span class="search-icon" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input type="text" id="search" placeholder="搜索待办标题…">
              <button type="button" class="search-clear" id="searchClear" aria-label="清空搜索">×</button>
            </div>
          </div>
        </div>

        <div class="canvas-inner">
          <div class="mobile-data-bar">
            <button type="button" class="data-btn" id="saveCloudBtnM">保存到云端</button>
            <button type="button" class="data-btn" id="pullCloudBtnM">从云端拉取</button>
            <button type="button" class="data-btn" id="exportJsonM">导出备份</button>
            <button type="button" class="data-btn" id="importBtnM">导入备份</button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json">

          <div class="list-groups" id="list"></div>

          <div class="empty" id="emptyBox" hidden>
            <div class="empty-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <div class="empty-title">暂无符合条件的待办</div>
            <div class="empty-sub">按 N 或点击「新建待办」记录一件新的事项</div>
          </div>

          <div class="footer-bar">
            <span class="count" id="footCount"></span>
            <button type="button" class="btn-clear" id="clearDone">清除已完成待办</button>
          </div>
        </div>
      </main>

    </div>

    <button type="button" class="fab" id="fabAdd" aria-label="新增待办">＋</button>
  </section>

  <!-- ================= 视图：新增 / 编辑 ================= -->
  <section class="view" id="view-edit">
    <div class="edit-shell">

<!-- 轻提示 Toast -->
<div class="toast-box" id="toastBox" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var REPEAT_LABEL = {none:"不重复", daily:"每天", workday:"工作日", weekly:"每周", monthly:"每月", yearly:"每年"};

  var DATA_KEY = "todo_items_v3";
  var CRED_KEY = "todo_pantry_cred_v1";
  var THEME_KEY = "todo_theme_pref_v1";
  var API = {
    base: "https://getpantry.cloud/apiv1/pantry",
    basket: "todos"
  };
  var cloud = loadCred();
  var todos = load();
  var editingId = null;
  var draftSubtasks = [];
  var expandedSubs = {};
  var filterStatus = "all", filterCategory = "all", keyword = "";

  // DOM
  var listEl = document.getElementById("list");
  var emptyBox = document.getElementById("emptyBox");
  var searchEl = document.getElementById("search");
  var searchClearEl = document.getElementById("searchClear");
  var filterCatEl = document.getElementById("filterCategory");
  var sideCatNav = document.getElementById("sideCatNav");
  var form = document.getElementById("todoForm");
  var titleInput = document.getElementById("title");
  var categorySel = document.getElementById("category");
  var prioritySel = document.getElementById("priority");
  var repeatSel = document.getElementById("repeat");
  var startDateInput = document.getElementById("startDate");
  var startTimeInput = document.getElementById("startTime");
  var loadMask = document.getElementById("loadMask");
  var loadMsg = document.getElementById("loadMsg");
  var saveCloudBtn = document.getElementById("saveCloudBtn");
  var pullCloudBtn = document.getElementById("pullCloudBtn");
  var saveCloudBtnM = document.getElementById("saveCloudBtnM");
  var pullCloudBtnM = document.getElementById("pullCloudBtnM");
  var bindBtn = document.getElementById("bindBtn");
  var bindBtnMobile = document.getElementById("bindBtnMobile");
  var bindBtnMobileText = document.getElementById("bindBtnMobileText");
  var ringFg = document.getElementById("ringFg");
  var ringPct = document.getElementById("ringPct");
  var viewHeadingTitle = document.getElementById("viewHeadingTitle");
  var viewHeadingCount = document.getElementById("viewHeadingCount");
  var themeToggle = document.getElementById("themeToggle");
  var themeIconSun = document.getElementById("themeIconSun");
  var themeIconMoon = document.getElementById("themeIconMoon");
  var themeColorMeta = document.getElementById("themeColorMeta");

  // 弹窗与 Toast
  var modalMask = document.getElementById("modalMask");
  var modalTitle = document.getElementById("modalTitle");
  var modalDesc = document.getElementById("modalDesc");
  var modalInput = document.getElementById("modalInput");
  var modalCancel = document.getElementById("modalCancel");
  var modalConfirm = document.getElementById("modalConfirm");
  var toastBox = document.getElementById("toastBox");

  // ===== 深浅色主题 =====
  function applyTheme(mode){
    var isDark = mode === "dark";
    document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    themeIconSun.hidden = isDark;
    themeIconMoon.hidden = !isDark;
    if(themeColorMeta) themeColorMeta.setAttribute("content", isDark ? "#111113" : "#f7f6f3");
    try{ localStorage.setItem(THEME_KEY, isDark ? "dark" : "light"); }catch(e){}
  }
  (function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
    if(saved === "dark" || saved === "light"){
      applyTheme(saved);
    }else{
      applyTheme("light");
    }
  })();
  themeToggle.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // ===== 实时日期显示 =====
  (function initDateHeader(){
    var now = new Date();
    var weeks = ["周日","周一","周二","周三","周四","周五","周六"];
    var el = document.getElementById("todayDateDisplay");
    if(el) el.textContent = (now.getMonth()+1) + "月" + now.getDate() + "日 · " + weeks[now.getDay()];
  })();

  function showToast(msg, type){
    var el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = msg;
    toastBox.appendChild(el);
    setTimeout(function(){
      el.style.opacity = "0";
      el.style.transform = "translateY(6px)";
      el.style.transition = "all .2s ease";
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 220);
    }, 2400);
  }

  function openModal(opts){
    return new Promise(function(resolve){
      modalTitle.textContent = opts.title || "提示";
      modalDesc.textContent = opts.desc || "";
      modalDesc.hidden = !opts.desc;
      var hasInput = !!opts.input;
      modalInput.hidden = !hasInput;
      modalInput.value = hasInput ? (opts.defaultValue || "") : "";
      modalInput.placeholder = opts.placeholder || "";
      modalCancel.hidden = !!opts.hideCancel;
      modalCancel.textContent = opts.cancelText || "取消";
      modalConfirm.textContent = opts.confirmText || "确定";
      modalConfirm.className = "modal-btn " + (opts.danger ? "danger" : "confirm");
      modalMask.hidden = false;

      if(hasInput){
        setTimeout(function(){ modalInput.focus(); modalInput.select(); }, 30);
      }else{
        setTimeout(function(){ modalConfirm.focus(); }, 30);
      }

      function cleanup(val){
        modalMask.hidden = true;
        modalCancel.removeEventListener("click", onCancel);
        modalConfirm.removeEventListener("click", onConfirm);
        modalMask.removeEventListener("click", onBackdrop);
        document.removeEventListener("keydown", onKey);
        resolve(val);
      }
      function onCancel(){ cleanup(hasInput ? null : false); }
      function onConfirm(){ cleanup(hasInput ? modalInput.value : true); }
      function onBackdrop(e){ if(e.target === modalMask) onCancel(); }
      function onKey(e){
        if(e.key === "Escape") onCancel();
        if(e.key === "Enter" && hasInput){ e.preventDefault(); onConfirm(); }
      }
      modalCancel.addEventListener("click", onCancel);
      modalConfirm.addEventListener("click", onConfirm);
      modalMask.addEventListener("click", onBackdrop);
      document.addEventListener("keydown", onKey);
    });
  }

  // ===== 本地持久化 =====
  function normalize(raw){
    if(!Array.isArray(raw)) return [];
    return raw.map(function(t){
      return {
        id: t.id || uid(),
        title: String(t.title || ""),
        note: String(t.note || ""),
        category: t.category || "其他",
        priority: t.priority || "中",
        startDate: t.startDate || t.dueDate || "",
        startTime: t.startTime || "",
        repeat: t.repeat || "none",
        recurPaused: !!t.recurPaused,
        done: !!t.done,
        createdAt: t.createdAt || Date.now(),
        subtasks: Array.isArray(t.subtasks) ? t.subtasks.map(function(s){
          return {id: s.id || uid(), title: String(s.title || ""), done: !!s.done};
        }) : []
      };
    });
  }
  function load(){
    try{
      var raw = localStorage.getItem(DATA_KEY);
      return normalize(raw ? JSON.parse(raw) : []);
    }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(DATA_KEY, JSON.stringify(todos)); }
    catch(e){ console.error("本地保存失败：", e); }
  }

  // ===== 云端凭证读写 =====
  function loadCred(){
    try{
      var raw = localStorage.getItem(CRED_KEY);
      if(!raw) return null;
      var o = JSON.parse(raw);
      var pid = o && (o.pantryId || o.id);
      return pid ? { pantryId: String(pid) } : null;
    }catch(e){ return null; }
  }
  function saveCred(c){
    cloud = { pantryId: String(c.pantryId || c.id) };
    try{ localStorage.setItem(CRED_KEY, JSON.stringify(cloud)); }
    catch(e){ console.error("凭证保存失败：", e); }
    syncCloudButtons();
  }
  function syncCloudButtons(){
    var isBound = !!(cloud && cloud.pantryId);
    bindBtn.classList.toggle("bound", isBound);
    bindBtn.textContent = isBound ? "已绑定云端" : "绑定云端";
    bindBtnMobile.classList.toggle("bound", isBound);
    bindBtnMobileText.textContent = isBound ? "已绑定" : "绑定云端";
  }

  // ===== 工具 =====
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return String(n).padStart(2,"0"); }
  function parseDate(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function subtasksAllDone(t){ return t.subtasks && t.subtasks.length>0 && t.subtasks.every(function(s){return s.done;}); }
  function todayStr(){ return fmtDate(new Date()); }
  function isOverdue(item){ return !item.done && item.startDate && item.startDate < todayStr(); }
  function fmtMD(dStr){ var p=dStr.split("-"); return (+p[1])+"月"+(+p[2])+"日"; }
  function dateLabel(dStr){
    var today=todayStr(), tomorrow=fmtDate(addDays(new Date(),1));
    if(dStr===today) return "今天 · "+fmtMD(dStr);
    if(dStr===tomorrow) return "明天 · "+fmtMD(dStr);
    var dt=parseDate(dStr);
    var week=["周日","周一","周二","周三","周四","周五","周六"][dt.getDay()];
    return fmtMD(dStr)+" "+week;
  }
  var PRIO={"高":0,"中":1,"低":2};
  function sortGroup(arr){
    return arr.slice().sort(function(a,b){
      if(a.done!==b.done) return a.done?1:-1;
      if(PRIO[a.priority]!==PRIO[b.priority]) return PRIO[a.priority]-PRIO[b.priority];
      return (a.startTime||"")<(b.startTime||"")?-1:1;
    });
  }

  function nextDate(repeat, startDate){
    var base = parseDate(startDate) || new Date();
    if(repeat==="daily") return fmtDate(addDays(base,1));
    if(repeat==="weekly") return fmtDate(addDays(base,7));
    if(repeat==="workday"){
      var d = addDays(base,1);
      while(d.getDay()===0 || d.getDay()===6){ d = addDays(d,1); }
      return fmtDate(d);
    }
    if(repeat==="monthly"){
      var y=base.getFullYear(), m=base.getMonth()+1, day=base.getDate();
      var nm=m+1, ny=y;
      if(nm>12){ nm=1; ny++; }
      var dimM=new Date(ny,nm,0).getDate();
      day=Math.min(day,dimM);
      return fmtDate(new Date(ny,nm-1,day));
    }
    if(repeat==="yearly"){
      var y2=base.getFullYear()+1, m2=base.getMonth(), day2=base.getDate();
      var dimY=new Date(y2,m2+1,0).getDate();
      day2=Math.min(day2,dimY);
      return fmtDate(new Date(y2,m2,day2));
    }
    return "";
  }

  // ===== 路由 =====
  function go(hash){ location.hash = hash; }
  function router(){
    var h = (location.hash || "#/").replace(/^#\/?/, "");
    var parts = h.split("/");
    var page = parts[0] || "list";
    var param = parts[1];

    document.getElementById("view-list").classList.toggle("active", page!=="edit");
    document.getElementById("view-edit").classList.toggle("active", page==="edit");

    if(page==="edit"){
      document.getElementById("editTitle").textContent = param ? "编辑待办" : "新增待办";
      if(param){ fillForm(param); } else { resetForm(); }
      setTimeout(function(){ titleInput.focus(); }, 40);
    }else{
      render();
    }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", router);

  // ===== 桌面快捷键（N 新建 / 搜索 / Esc 返回） =====
  document.addEventListener("keydown", function(e){
    if(!modalMask.hidden || !dpMask.hidden) return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    var isEditing = tag === "input" || tag === "textarea" || tag === "select";
    if(e.key === "Escape"){
      if(document.getElementById("view-edit").classList.contains("active")){
        go("#/");
      }else if(isEditing){
        e.target.blur();
      }
      return;
    }
    if(isEditing || e.metaKey || e.ctrlKey || e.altKey) return;
    if((e.key === "n" || e.key === "N") && document.getElementById("view-list").classList.contains("active")){
      e.preventDefault();
      go("#/edit");
    }else if(e.key === "/" && document.getElementById("view-list").classList.contains("active")){
      e.preventDefault();
      searchEl.focus();
    }
  });

  // ===== 同步分类筛选 =====
  function setCategoryFilter(cat){
    filterCategory = cat;
    filterCatEl.value = cat;
    Array.prototype.forEach.call(sideCatNav.querySelectorAll(".cat-item"), function(btn){
      btn.classList.toggle("active", btn.dataset.cat === cat);
    });
    render();
  }

  // ===== 列表渲染 =====
  function render(){
    var active = todos.filter(function(t){return !t.done;});
    var done = todos.filter(function(t){return t.done;});
    var paused = todos.filter(function(t){return t.recurPaused;});
    var today = todayStr();
    var todayTodo = todos.filter(function(t){ return !t.done && (!t.startDate || t.startDate <= today); });
    document.getElementById("statActive").textContent = active.length;
    document.getElementById("statToday").textContent = todayTodo.length;
    document.getElementById("statDone").textContent = done.length;
    document.getElementById("statPaused").textContent = paused.length;

    // 实时圆环完成率
    var pctAll = todos.length ? Math.round((done.length / todos.length) * 100) : 0;
    var circ = 94.25;
    ringFg.style.strokeDashoffset = String(circ - (circ * pctAll / 100));
    ringPct.textContent = pctAll + "%";

    // 分类计数
    var catCounts = {"all": todos.length, "工作":0, "生活":0, "学习":0, "其他":0};
    todos.forEach(function(t){
      if(catCounts[t.category] !== undefined) catCounts[t.category]++;
      else catCounts["其他"]++;
    });
    Object.keys(catCounts).forEach(function(k){
      var el = sideCatNav.querySelector('[data-cnt="'+k+'"]');
      if(el) el.textContent = catCounts[k];
    });

    var view = todos.filter(function(t){
      if(filterStatus==="active" && t.done) return false;
      if(filterStatus==="done" && !t.done) return false;
      if(filterCategory!=="all" && t.category!==filterCategory) return false;
      if(keyword){
        var kw = keyword.toLowerCase();
        if(t.title.toLowerCase().indexOf(kw)===-1 && t.note.toLowerCase().indexOf(kw)===-1) return false;
      }
      return true;
    });

    viewHeadingTitle.textContent = filterCategory === "all" ? "全部待办" : filterCategory;
    viewHeadingCount.textContent = view.length + " 项";

    listEl.innerHTML = "";
    emptyBox.hidden = view.length !== 0;

    var groups = buildGroups(view);
    groups.forEach(function(g){
      if(!g.items.length) return;
      var block = document.createElement("div");
      block.className = "group-block";

      var head = document.createElement("div");
      head.className = "group-header" + (g.key==="overdue"?" group-overdue":"") + (g.key==="today"?" group-today":"");
      var label = document.createElement("span");
      label.className = "group-label";
      label.textContent = g.label;
      var cnt = document.createElement("span");
      cnt.className = "cnt";
      cnt.textContent = g.items.length + " 项";
      head.appendChild(label); head.appendChild(cnt);
      block.appendChild(head);

      var ul = document.createElement("ul");
      ul.className = "list";
      g.items.forEach(function(item){ ul.appendChild(buildItem(item)); });
      block.appendChild(ul);
      listEl.appendChild(block);
    });

    document.getElementById("footCount").textContent = "共 " + todos.length + " 项 · 进行中 " + active.length + " 项";
  }

  function buildGroups(view){
    var today = todayStr();
    var overdue=[], todayArr=[], noDate=[], futureMap={};
    view.forEach(function(t){
      if(isOverdue(t)){ overdue.push(t); return; }
      if(!t.startDate){ noDate.push(t); return; }
      if(t.startDate===today){ todayArr.push(t); return; }
      (futureMap[t.startDate]=futureMap[t.startDate]||[]).push(t);
    });
    var groups = [
      {key:"overdue", label:"已逾期", items:sortGroup(overdue)},
      {key:"today", label:dateLabel(today), items:sortGroup(todayArr)}
    ];
    Object.keys(futureMap).sort().forEach(function(d){
      groups.push({key:d, label:dateLabel(d), items:sortGroup(futureMap[d])});
    });
    groups.push({key:"nodate", label:"未排期", items:sortGroup(noDate)});
    return groups.filter(function(g){ return g.items.length; });
  }

  function startLabel(item){
    if(!item.startDate) return "";
    return item.startDate + (item.startTime ? " " + item.startTime : "");
  }

  function buildItem(item){
    var li = document.createElement("li");
    li.className = "item" + (item.done ? " done" : "") + (!item.done && item.priority === "高" ? " prio-high-row" : "");
    li.dataset.id = item.id;

    // 顶行：勾选框 + 标题 + 操作按钮
    var topRow = document.createElement("div");
    topRow.className = "item-top-row";

    var check = document.createElement("button");
    check.type = "button";
    check.className = "check" + (item.done ? " checked" : "");
    check.setAttribute("aria-label", item.done ? "标记为未完成" : "标记为已完成");
    check.addEventListener("click", function(){ toggleDone(item.id); });

    var t = document.createElement("div");
    t.className = "item-title";
    t.textContent = item.title;

    var ops = document.createElement("div");
    ops.className = "item-ops";

    if(item.repeat && item.repeat!=="none"){
      var pauseBtn = document.createElement("button");
      pauseBtn.type = "button";
      pauseBtn.className = "icon-btn pause" + (item.recurPaused ? " on" : "");
      pauseBtn.textContent = item.recurPaused ? "恢复" : "中止";
      pauseBtn.addEventListener("click", function(){ togglePause(item.id); });
      ops.appendChild(pauseBtn);
    }

    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "icon-btn edit";
    editBtn.title = "编辑"; editBtn.textContent = "编辑";
    editBtn.setAttribute("aria-label", "编辑待办");
    editBtn.addEventListener("click", function(){ go("#/edit/" + item.id); });

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "del-btn";
    delBtn.title = "删除"; delBtn.textContent = "删除";
    delBtn.addEventListener("click", function(){ remove(item.id); });

    ops.appendChild(editBtn); ops.appendChild(delBtn);
    topRow.appendChild(check); topRow.appendChild(t); topRow.appendChild(ops);
    li.appendChild(topRow);

    // 底行：左侧低干扰元信息，右侧子任务进度+展开/收起按钮
    var bottomRow = document.createElement("div");
    bottomRow.className = "item-bottom-row";

    var tags = document.createElement("div");
    tags.className = "item-tags";

    var sl = startLabel(item);
    if(sl){
      var startEl = document.createElement("span");
      startEl.className = "start-label" + (isOverdue(item) ? " overdue" : "");
      startEl.textContent = sl;
      tags.appendChild(startEl);
    }

    var cat = document.createElement("span");
    cat.className = "tag cat"; cat.textContent = item.category;
    var prio = document.createElement("span");
    prio.className = "tag prio-" + (item.priority==="高"?"high":item.priority==="中"?"mid":"low");
    prio.textContent = item.priority + "优先级";
    tags.appendChild(cat); tags.appendChild(prio);

    if(item.repeat && item.repeat!=="none"){
      var rep = document.createElement("span");
      rep.className = "tag rep"; rep.textContent = "↻ " + REPEAT_LABEL[item.repeat];
      tags.appendChild(rep);
      if(item.recurPaused){
        var pd = document.createElement("span");
        pd.className = "tag paused"; pd.textContent = "已中止";
        tags.appendChild(pd);
      }
    }
    bottomRow.appendChild(tags);

    var subList = null;
    if(item.subtasks && item.subtasks.length){
      var doneCount = item.subtasks.filter(function(s){return s.done;}).length;
      var pct = Math.round((doneCount / item.subtasks.length) * 100);
      var isOpen = !!expandedSubs[item.id];

      var subInline = document.createElement("div");
      subInline.className = "sub-inline";

      var prog = document.createElement("span");
      prog.className = "sub-progress";
      prog.textContent = "子任务 " + doneCount + "/" + item.subtasks.length;
      var bar = document.createElement("div");
      bar.className = "sub-bar";
      var fill = document.createElement("div");
      fill.className = "sub-bar-fill";
      fill.style.width = pct + "%";
      bar.appendChild(fill);

      var toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "sub-toggle";
      toggleBtn.textContent = isOpen ? "收起 ▴" : "展开 ▾";
      toggleBtn.setAttribute("aria-expanded", String(isOpen));

      subInline.appendChild(prog);
      subInline.appendChild(bar);
      subInline.appendChild(toggleBtn);
      bottomRow.appendChild(subInline);

      subList = document.createElement("div");
      subList.className = "sub-list";
      subList.hidden = !isOpen;

      item.subtasks.forEach(function(sub){
        var row = document.createElement("div");
        row.className = "sub" + (sub.done ? " done" : "");
        var sc = document.createElement("button");
        sc.type = "button";
        sc.className = "check" + (sub.done ? " checked" : "");
        sc.setAttribute("aria-label", sub.done ? "取消完成子任务" : "完成子任务");
        sc.addEventListener("click", function(){ toggleSub(item.id, sub.id); });
        var st = document.createElement("span");
        st.className = "sub-title"; st.textContent = sub.title;
        row.appendChild(sc); row.appendChild(st);
        subList.appendChild(row);
      });

      toggleBtn.addEventListener("click", function(){
        expandedSubs[item.id] = !expandedSubs[item.id];
        var open = !!expandedSubs[item.id];
        subList.hidden = !open;
        toggleBtn.textContent = open ? "收起 ▴" : "展开 ▾";
        toggleBtn.setAttribute("aria-expanded", String(open));
      });
    }

    li.appendChild(bottomRow);
    if(subList) li.appendChild(subList);
    return li;
  }

  // ===== 完成 / 顺延 / 中止 =====
  function cloneForRecur(t){
    return {
      id: uid(), title: t.title, note: t.note, category: t.category, priority: t.priority,
      startDate: nextDate(t.repeat, t.startDate), startTime: t.startTime,
      repeat: t.repeat, recurPaused: false, done: false, createdAt: Date.now(),
      subtasks: (t.subtasks||[]).map(function(s){ return {id:uid(), title:s.title, done:false}; })
    };
  }
  function completeTask(t){
    t.done = true;
    if(t.repeat && t.repeat!=="none" && !t.recurPaused){
      var next = cloneForRecur(t);
      var idx = todos.indexOf(t);
      todos.splice(idx+1, 0, next);
      showToast("已完成，已生成下一次重复待办", "success");
    }
    save(); render();
  }
  function toggleDone(id){
    var t = todos.find(function(x){return x.id===id;});
    if(!t) return;
    if(!t.done){ completeTask(t); } else { t.done=false; save(); render(); }
  }
  function togglePause(id){
    var t = todos.find(function(x){return x.id===id;});
    if(!t) return;
    t.recurPaused = !t.recurPaused;
    save(); render();
    showToast(t.recurPaused ? "已中止重复计划" : "已恢复重复计划");
  }

  // ===== 子任务 =====
  function toggleSub(pid, sid){
    var p = todos.find(function(x){return x.id===pid;});
    if(!p) return;
    var s = p.subtasks.find(function(x){return x.id===sid;});
    if(!s) return;
    s.done = !s.done;
    if(!p.done && subtasksAllDone(p)){ completeTask(p); } else { save(); render(); }
  }

  // ===== 删除 =====
  async function remove(id){
    var t = todos.find(function(x){return x.id===id;});
    if(!t) return;
    var ok = await openModal({
      title: "删除待办",
      desc: "确定删除「" + t.title + "」？其子任务也会一并删除。",
      confirmText: "删除",
      danger: true
    });
    if(!ok) return;
    todos = todos.filter(function(x){return x.id!==id;});
    if(editingId===id){ editingId=null; }
    save(); render();
    showToast("已删除待办");
  }

  // ===== 表单内子任务管理 & 大号日期选择器 =====
  var formSubList = document.getElementById("formSubList");
  var formSubInput = document.getElementById("formSubInput");
  var formSubAddBtn = document.getElementById("formSubAddBtn");
  var formSubCount = document.getElementById("formSubCount");

  function renderFormSubs(){
    formSubList.innerHTML = "";
    formSubCount.textContent = draftSubtasks.length + " 项";
    draftSubtasks.forEach(function(sub, idx){
      var row = document.createElement("div");
      row.className = "form-sub-row" + (sub.done ? " done" : "");
      var ck = document.createElement("button");
      ck.type = "button";
      ck.className = "check" + (sub.done ? " checked" : "");
      ck.setAttribute("aria-label", sub.done ? "取消完成子任务" : "完成子任务");
      ck.addEventListener("click", function(){
        sub.done = !sub.done;
        renderFormSubs();
      });
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = "form-sub-input";
      inp.value = sub.title;
      inp.maxLength = 60;
      inp.addEventListener("input", function(){ sub.title = inp.value; });
      var del = document.createElement("button");
      del.type = "button";
      del.className = "sub-del";
      del.textContent = "×";
      del.setAttribute("aria-label", "删除子任务");
      del.addEventListener("click", function(){
        draftSubtasks.splice(idx, 1);
        renderFormSubs();
      });
      row.appendChild(ck); row.appendChild(inp); row.appendChild(del);
      formSubList.appendChild(row);
    });
  }

  function addDraftSub(){
    var v = formSubInput.value.trim();
    if(!v) return;
    draftSubtasks.push({ id: uid(), title: v, done: false });
    formSubInput.value = "";
    renderFormSubs();
    formSubInput.focus();
  }
  formSubAddBtn.addEventListener("click", addDraftSub);
  formSubInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); addDraftSub(); }
  });

  // 大号日期选择器
  var dpMask = document.getElementById("dpMask");
  var dpMonthLabel = document.getElementById("dpMonthLabel");
  var dpGrid = document.getElementById("dpGrid");
  var dpViewYear = new Date().getFullYear();
  var dpViewMonth = new Date().getMonth();

  function renderDatePicker(){
    dpMonthLabel.textContent = dpViewYear + "年 " + (dpViewMonth + 1) + "月";
    dpGrid.innerHTML = "";
    var first = new Date(dpViewYear, dpViewMonth, 1);
    var startOffset = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(dpViewYear, dpViewMonth + 1, 0).getDate();
    var prevMonthDays = new Date(dpViewYear, dpViewMonth, 0).getDate();
    var today = todayStr();
    var selected = startDateInput.value;

    for(var i = startOffset - 1; i >= 0; i--){
      appendDpDay(new Date(dpViewYear, dpViewMonth - 1, prevMonthDays - i), true, today, selected);
    }
    for(var d = 1; d <= daysInMonth; d++){
      appendDpDay(new Date(dpViewYear, dpViewMonth, d), false, today, selected);
    }
    var totalCells = startOffset + daysInMonth;
    var tail = (7 - (totalCells % 7)) % 7;
    for(var j = 1; j <= tail; j++){
      appendDpDay(new Date(dpViewYear, dpViewMonth + 1, j), true, today, selected);
    }
  }

  function appendDpDay(dateObj, isOther, today, selected){
    var str = fmtDate(dateObj);
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dp-day" + (isOther ? " other-month" : "") + (str === today ? " today" : "") + (str === selected ? " selected" : "");
    btn.textContent = String(dateObj.getDate());
    btn.addEventListener("click", function(){
      startDateInput.value = str;
      dpMask.hidden = true;
    });
    dpGrid.appendChild(btn);
  }

  function openDatePicker(){
    var cur = parseDate(startDateInput.value) || new Date();
    dpViewYear = cur.getFullYear();
    dpViewMonth = cur.getMonth();
    renderDatePicker();
    dpMask.hidden = false;
  }

  startDateInput.addEventListener("click", openDatePicker);
  document.getElementById("dpPrev").addEventListener("click", function(){
    dpViewMonth--;
    if(dpViewMonth < 0){ dpViewMonth = 11; dpViewYear--; }
    renderDatePicker();
  });
  document.getElementById("dpNext").addEventListener("click", function(){
    dpViewMonth++;
    if(dpViewMonth > 11){ dpViewMonth = 0; dpViewYear++; }
    renderDatePicker();
  });
  document.getElementById("dpToday").addEventListener("click", function(){
    startDateInput.value = todayStr();
    dpMask.hidden = true;
  });
  document.getElementById("dpTomorrow").addEventListener("click", function(){
    startDateInput.value = fmtDate(addDays(new Date(), 1));
    dpMask.hidden = true;
  });
  document.getElementById("dpClear").addEventListener("click", function(){
    startDateInput.value = "";
    dpMask.hidden = true;
  });
  document.getElementById("dpClose").addEventListener("click", function(){ dpMask.hidden = true; });
  dpMask.addEventListener("click", function(e){ if(e.target === dpMask) dpMask.hidden = true; });

  // ===== 表单：新增 / 编辑 =====
  function resetForm(){
    editingId = null;
    form.reset();
    startDateInput.value = todayStr();
    draftSubtasks = [];
    formSubInput.value = "";
    renderFormSubs();
  }
  function fillForm(id){
    var t = todos.find(function(x){return x.id===id;});
    if(!t){ resetForm(); return; }
    editingId = id;
    titleInput.value = t.title;
    categorySel.value = t.category;
    prioritySel.value = t.priority;
    repeatSel.value = t.repeat || "none";
    startDateInput.value = t.startDate || "";
    startTimeInput.value = t.startTime || "";
    draftSubtasks = (t.subtasks || []).map(function(s){
      return { id: s.id || uid(), title: String(s.title || ""), done: !!s.done };
    });
    formSubInput.value = "";
    renderFormSubs();
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var title = titleInput.value.trim();
    if(!title){ showToast("请填写任务标题", "error"); titleInput.focus(); return; }
    var cleanSubs = draftSubtasks.map(function(s){
      return { id: s.id || uid(), title: String(s.title || "").trim(), done: !!s.done };
    }).filter(function(s){ return s.title.length > 0; });

    var data = {
      title: title,
      category: categorySel.value,
      priority: prioritySel.value,
      repeat: repeatSel.value,
      startDate: startDateInput.value,
      startTime: startTimeInput.value,
      subtasks: cleanSubs
    };
    if(editingId){
      var t = todos.find(function(x){return x.id===editingId;});
      if(t) Object.assign(t, data);
      showToast("已更新待办", "success");
    }else{
      todos.push(Object.assign({
        id: uid(), note: "", recurPaused: false, done: false, createdAt: Date.now()
      }, data));
      showToast("已添加待办", "success");
    }
    save();
    go("#/");
  });

  document.getElementById("backBtn").addEventListener("click", function(){ go("#/"); });
  document.getElementById("cancelBtn").addEventListener("click", function(){ go("#/"); });
  document.getElementById("fabAdd").addEventListener("click", function(){ go("#/edit"); });
  document.getElementById("desktopAddBtn").addEventListener("click", function(){ go("#/edit"); });

  // ===== 筛选 =====
  var statusTabBtns = document.querySelectorAll("#statusTabs .tab");
  Array.prototype.forEach.call(statusTabBtns, function(btn){
    btn.addEventListener("click", function(){
      filterStatus = btn.getAttribute("data-status");
      Array.prototype.forEach.call(statusTabBtns, function(c){ c.classList.remove("active"); });
      btn.classList.add("active");
      render();
    });
  });
  sideCatNav.addEventListener("click", function(e){
    var btn = e.target.closest(".cat-item");
    if(!btn) return;
    setCategoryFilter(btn.dataset.cat);
  });
  filterCatEl.addEventListener("change", function(){ setCategoryFilter(this.value); });

  searchEl.addEventListener("input", function(){
    keyword = this.value.trim();
    searchClearEl.classList.toggle("show", this.value.length > 0);
    render();
  });
  searchClearEl.addEventListener("click", function(){
    searchEl.value = "";
    keyword = "";
    searchClearEl.classList.remove("show");
    render();
    searchEl.focus();
  });

  document.getElementById("clearDone").addEventListener("click", async function(){
    if(!todos.some(function(x){return x.done;})){
      showToast("当前没有已完成的待办");
      return;
    }
    var ok = await openModal({
      title: "清除已完成待办",
      desc: "确定要清除所有已完成的待办吗？此操作无法撤销。",
      confirmText: "清除",
      danger: true
    });
    if(!ok) return;
    todos = todos.filter(function(x){return !x.done;});
    save(); render();
    showToast("已清除所有已完成待办", "success");
  });

  // ===== 导出 / 导入 =====
  function downloadBlob(content, filename, mime){
    var blob = new Blob([content], {type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }
  function stamp(){ var d=new Date(); return ""+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }

  function handleExport(){
    if(!todos.length){ showToast("暂无数据可导出"); return; }
    downloadBlob(JSON.stringify(todos, null, 2), "待办备份_"+stamp()+".json", "application/json");
    showToast("备份文件已导出", "success");
  }
  document.getElementById("exportJson").addEventListener("click", handleExport);
  document.getElementById("exportJsonM").addEventListener("click", handleExport);

  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function(){ importFile.click(); });
  document.getElementById("importBtnM").addEventListener("click", function(){ importFile.click(); });
  importFile.addEventListener("change", function(){
    var file = importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(){
      try{
        var parsed = JSON.parse(reader.result);
        var rawArr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.todos) ? parsed.todos : []);
        var data = normalize(rawArr);
        if(!data.length){ showToast("备份文件中没有有效待办", "error"); return; }
        var ok = await openModal({
          title: "确认导入备份",
          desc: "导入将覆盖当前全部 " + todos.length + " 条待办（备份中共有 " + data.length + " 条），确定继续？",
          confirmText: "覆盖导入",
          danger: true
        });
        if(!ok) return;
        todos = data; save(); render();
        showToast("已导入 " + todos.length + " 条待办", "success");
      }catch(e){
        showToast("文件解析失败，请选择有效的 JSON 备份文件", "error");
      }finally{
        importFile.value = "";
      }
    };
    reader.readAsText(file);
  });

  // ===== 云端读写（Pantry） =====
  function showMask(msg){ loadMsg.textContent = msg; loadMask.hidden = false; }
  function hideMask(){ loadMask.hidden = true; }

  function basketUrl(){
    return API.base + "/" + encodeURIComponent(cloud.pantryId) + "/basket/" + encodeURIComponent(API.basket);
  }

  function extractTodos(payload){
    if(Array.isArray(payload)) return payload;
    if(payload && Array.isArray(payload.todos)) return payload.todos;
    if(payload && payload.data){
      if(Array.isArray(payload.data)) return payload.data;
      if(Array.isArray(payload.data.todos)) return payload.data.todos;
    }
    return [];
  }

  async function fetchCloud(){
    var res = await fetch(basketUrl(), {cache:"no-store"});
    if(!res.ok) throw new Error("云端读取失败（HTTP " + res.status + "）");
    var payload = await res.json();
    return normalize(extractTodos(payload));
  }

  async function loadFromCloud(){
    if(!cloud || !cloud.pantryId){
      showToast("尚未绑定云端，请先点击「绑定云端」", "error");
      return;
    }
    showMask("正在从云端获取数据…");
    var timer = setTimeout(function(){ loadMsg.textContent = "请求耗时较长，请检查网络后稍候…"; }, 8000);
    try{
      var remote = await fetchCloud();
      clearTimeout(timer);
      todos = remote;
      save(); render();
      hideMask();
      showToast("已从云端拉取 " + todos.length + " 条待办", "success");
    }catch(e){
      clearTimeout(timer);
      console.error(e);
      hideMask();
      await openModal({
        title: "云端加载失败",
        desc: e.message + "。本地清单不受影响，可继续使用。",
        confirmText: "知道了",
        hideCancel: true
      });
    }
  }

  async function saveToCloud(){
    if(saveCloudBtn.disabled) return;
    if(!cloud || !cloud.pantryId){
      showToast("尚未绑定云端，请先点击「绑定云端」", "error");
      return;
    }
    saveCloudBtn.disabled = true;
    saveCloudBtnM.disabled = true;
    var bodyData = { todos: todos, updatedAt: new Date().toISOString() };
    try{
      var res = await fetch(basketUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bodyData)
      });
      if(!res.ok){
        var e1 = await res.json().catch(function(){ return {}; });
        var msg = e1.message || e1.error || ("HTTP " + res.status);
        if(res.status === 429) msg = "请求过于频繁，已被限流，请稍后再试";
        throw new Error(msg);
      }
      showToast("已保存到云端", "success");
    }catch(e){
      console.error(e);
      showToast("保存失败：" + e.message, "error");
    }finally{
      saveCloudBtn.disabled = false;
      saveCloudBtnM.disabled = false;
    }
  }

  saveCloudBtn.addEventListener("click", saveToCloud);
  saveCloudBtnM.addEventListener("click", saveToCloud);
  pullCloudBtn.addEventListener("click", loadFromCloud);
  pullCloudBtnM.addEventListener("click", loadFromCloud);

  async function handleBind(){
    var pid = await openModal({
      title: "绑定云端存储（Pantry）",
      desc: "请输入 getpantry.cloud 个人中心里的 Pantry ID（UUID）：",
      input: true,
      defaultValue: cloud && cloud.pantryId ? cloud.pantryId : "",
      placeholder: "例如：xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
      confirmText: "保存绑定"
    });
    if(pid === null) return;
    pid = pid.trim();
    if(!pid){ showToast("Pantry ID 不能为空", "error"); return; }
    saveCred({ pantryId: pid });
    var pullNow = await openModal({
      title: "绑定成功",
      desc: "Pantry ID 已保存到本地。是否立即从云端拉取数据覆盖本地清单？",
      confirmText: "立即拉取",
      cancelText: "暂不拉取"
    });
    if(pullNow){
      await loadFromCloud();
    }
  }

  bindBtn.addEventListener("click", handleBind);
  bindBtnMobile.addEventListener("click", handleBind);

  syncCloudButtons();
  router();
  render();
})();
</script>
</body>
